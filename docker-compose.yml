services:
  postgres:
    image: postgres:17-alpine
    container_name: imdbselector-postgres
    environment:
      POSTGRES_DB: imdbselector
      POSTGRES_USER: imdb
      POSTGRES_PASSWORD: imdb
    ports:
      - "5432:5432"
    volumes:
      - imdbselector_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imdb -d imdbselector"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: imdbselector-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/imdbselector
      DB_USER: imdb
      DB_PASSWORD: imdb
      CORS_ORIGIN: "*"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: imdbselector-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  imdbselector_pgdata:
